apiVersion: apps/v1
kind: Deployment
metadata:
  name: yantra-web
  namespace: yantra
  labels:
    app: yantra-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yantra-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: yantra-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # the "node" user in node:alpine
      containers:
        - name: web
          # Jenkins replaces this with the image it just built (see the Jenkinsfile deploy stage).
          # For a manual local deploy, build it first: docker build -t yantra-web:latest .
          image: yantra-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5500
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5500"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
